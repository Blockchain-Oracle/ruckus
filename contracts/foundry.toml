# Mirrors the Chain simulator compiler settings (solc 0.8.30, optimizer 200 runs, via-IR)
# so sizes and behaviour match what the harness deploys.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./vectors" }]

[fuzz]
runs = 2000

[fmt]
line_length = 100
tab_width = 4
