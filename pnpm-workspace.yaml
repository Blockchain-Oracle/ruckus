# Explicit globs only — casino-sdk/ and references/ must never join the workspace (ADR-003).
packages:
  - apps/*
  - packages/*
  - convex
  - contracts

catalog:
  typescript: 7.0.2
  vitest: 5.0.2
  zod: ^4.4.3
  react: ^19.3.0
  react-dom: ^19.3.0
  three: ^0.186.0

# pnpm 10 blocks dependency install scripts unless allow-listed.
onlyBuiltDependencies:
  - lefthook
  - esbuild
